name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache ktfmt
        uses: actions/cache@v4
        with:
          path: ~/.local/analysis-tools/ktfmt.jar
          key: ktfmt-0.62

      - name: Cache ktlint
        uses: actions/cache@v4
        with:
          path: ~/.local/analysis-tools/ktlint
          key: ktlint-1.5.0

      - name: Cache detekt
        uses: actions/cache@v4
        with:
          path: ~/.local/analysis-tools/detekt.jar
          key: detekt-1.23.8

      - name: Check formatting, lint, and static analysis
        run: make check

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build all modules
        run: ./gradlew build

      - name: Common unit tests and GameTests
        timeout-minutes: 12
        run: ./gradlew :common:test :neoforge:runGameTestServer :fabric:runGameTestServer

      - name: Verify coverage
        run: ./gradlew verifyCoverage
