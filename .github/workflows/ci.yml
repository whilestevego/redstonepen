name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Temurin JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache ktfmt
        uses: actions/cache@v4
        with:
          path: ~/.local/analysis-tools/ktfmt.jar
          key: ktfmt-0.62

      - name: Cache ktlint
        uses: actions/cache@v4
        with:
          path: ~/.local/analysis-tools/ktlint
          key: ktlint-1.5.0

      - name: Cache krit
        uses: actions/cache@v4
        with:
          path: ~/.local/analysis-tools/krit.jar
          key: krit-0.3.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check formatting, lint, and static analysis
        run: make check

      - name: Semantic analysis (krit)
        run: make krit

  neoforge-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: NeoForge tests and coverage
        timeout-minutes: 10
        run: ./gradlew :neoforge:coverage

  fabric-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fabric tests and coverage
        timeout-minutes: 10
        run: ./gradlew :fabric:coverage
