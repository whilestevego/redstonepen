// @file build.gradle
plugins {
  id 'architectury-plugin' version '3.5.166'
  id 'dev.architectury.loom' version '1.14.473' apply false
  id 'com.gradleup.shadow' version '9.4.1' apply false
  id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}" apply false
  id 'org.jetbrains.kotlin.plugin.power-assert' version "${kotlin_version}" apply false
  id 'com.diffplug.spotless' version '8.4.0' apply false
  id 'org.jlleitschuh.gradle.ktlint' version '12.2.0' apply false
  id 'io.gitlab.arturbosch.detekt' version '1.23.8' apply false
}

// Root-level platform-specific run aliases.
gradle.projectsEvaluated {
  [
    [name: 'runNeoForgeClient', task: 'runClient',  proj: ':neoforge'],
    [name: 'runNeoForgeServer', task: 'runServer',  proj: ':neoforge'],
    [name: 'runNeoForgeData',   task: 'runData',    proj: ':neoforge'],
    [name: 'runFabricClient',   task: 'runClient',  proj: ':fabric'],
    [name: 'runFabricServer',   task: 'runServer',  proj: ':fabric'],
  ].each { entry ->
    def target = project(entry.proj).tasks.findByName(entry.task)
    if (target) {
      tasks.register(entry.name) {
        group = 'fabric loom'
        dependsOn target
      }
    }
  }
}

tasks.register('format') {
  group = 'verification'
  description = 'Check Kotlin formatting (ktfmt via Spotless). Use formatFix to apply.'
  dependsOn ':common:spotlessCheck', ':neoforge:spotlessCheck', ':fabric:spotlessCheck'
}

tasks.register('formatFix') {
  group = 'formatting'
  description = 'Apply ktfmt formatting to all Kotlin source files.'
  dependsOn ':common:spotlessApply', ':neoforge:spotlessApply', ':fabric:spotlessApply'
}

tasks.register('lint') {
  group = 'verification'
  description = 'Check Kotlin lint rules (ktlint). Use lintFix to auto-correct.'
  dependsOn ':common:ktlintCheck', ':neoforge:ktlintCheck', ':fabric:ktlintCheck'
}

tasks.register('lintFix') {
  group = 'formatting'
  description = 'Auto-correct ktlint violations across all Kotlin source files.'
  dependsOn ':common:ktlintFormat', ':neoforge:ktlintFormat', ':fabric:ktlintFormat'
}

tasks.register('analyze') {
  group = 'verification'
  description = 'Run detekt static analysis on all subprojects.'
  dependsOn ':common:detekt', ':neoforge:detekt', ':fabric:detekt'
}

tasks.register('analyzeFull') {
  group = 'verification'
  description = 'Run detekt static analysis on all subprojects ignoring the baseline.'
  dependsOn ':common:detektFull', ':neoforge:detektFull', ':fabric:detektFull'
}

tasks.register('analyzeBaseline') {
  group = 'verification'
  description = 'Regenerate detekt baselines for all subprojects.'
  dependsOn ':common:detektBaseline', ':neoforge:detektBaseline', ':fabric:detektBaseline'
}

tasks.register('coverage') {
  group = 'verification'
  description = 'Runs all platform test suites and verifies JaCoCo coverage.'
  dependsOn ':neoforge:coverage', ':fabric:coverage'
}

tasks.register('verifyCoverage') {
  group = 'verification'
  description = 'Generates JaCoCo reports and enforces coverage thresholds without re-running tests.'
  dependsOn ':neoforge:jacocoTestReport', ':neoforge:jacocoTestCoverageVerification',
            ':fabric:jacocoTestReport',   ':fabric:jacocoTestCoverageVerification'
}

// GameTest servers bind a network port — run them sequentially to avoid conflicts.
// swapInInstrumentedClasses for both platforms touch the shared common devlibs JAR;
// enforce full NeoForge swap→run→restore sequence before Fabric swap begins.
gradle.projectsEvaluated {
  project(':fabric').tasks.named('runGameTestServer') {
    mustRunAfter project(':neoforge').tasks.named('runGameTestServer')
  }
  project(':fabric').tasks.named('swapInInstrumentedClasses') {
    mustRunAfter project(':neoforge').tasks.named('restoreOriginalClasses')
  }
}

subprojects {
  apply plugin: 'java'
  apply plugin: 'architectury-plugin'
  apply plugin: 'com.diffplug.spotless'
  apply plugin: 'org.jlleitschuh.gradle.ktlint'
  apply plugin: 'io.gitlab.arturbosch.detekt'

  java.toolchain.languageVersion = JavaLanguageVersion.of(21)

  spotless {
    kotlin {
      ktfmt('0.62').kotlinlangStyle()
      target 'src/**/*.kt'
    }
  }

  ktlint {
    version = '1.5.0'
    android = false
    outputToConsole = true
  }

  repositories {
    mavenLocal()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.architectury.dev/' }
    maven { url = 'https://maven.fabricmc.net/' }
    maven {
      name = 'ParchmentMC'
      url = 'https://maven.parchmentmc.org'
    }
    maven {
      name = 'KotlinForForge'
      url = 'https://thedarkcolour.github.io/KotlinForForge/'
    }
  }

  detekt {
    buildUponDefaultConfig = true
    parallel = true
    config.setFrom(rootProject.file('config/detekt/detekt.yml'))
    baseline = rootProject.file("config/detekt/baseline-${project.name}.xml")
  }

  tasks.register('detektFull', io.gitlab.arturbosch.detekt.Detekt) {
    description = 'Run detekt static analysis ignoring the baseline.'
    buildUponDefaultConfig = true
    parallel = true
    config.setFrom(rootProject.file('config/detekt/detekt.yml'))
    setSource(fileTree('src').include('**/*.kt'))
    jvmTarget = '21'
    reports {
      html.required.set(true)
      sarif.required.set(false)
      xml.required.set(false)
      txt.required.set(false)
    }
  }

  tasks.withType(io.gitlab.arturbosch.detekt.Detekt).configureEach {
    jvmTarget = '21'
    reports {
      html.required.set(true)
      sarif.required.set(true)
      xml.required.set(false)
      txt.required.set(false)
    }
  }

  tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
  }
}
