build:
  maxIssues: 0

# Naming conventions in this codebase follow Minecraft modding standards:
# UPPER_CASE for block/item registrations, some snake_case in legacy code.
# Naming rules are disabled here for the same reason they are in ktlint.
naming:
  active: false

# KDoc enforcement is too noisy for an initial setup on a mod codebase.
comments:
  active: false

complexity:
  # Minecraft game logic methods are inherently longer than typical application
  # code; loosen the defaults to avoid baseline noise on legitimate complexity.
  CyclomaticComplexMethod:
    threshold: 20
  CognitiveComplexMethod:
    threshold: 20
  LongMethod:
    threshold: 80
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 8
  TooManyFunctions:
    thresholdInFiles: 30
    thresholdInClasses: 30
    thresholdInInterfaces: 20
    thresholdInObjects: 30
    thresholdInEnums: 20

empty-blocks:
  EmptyFunctionBlock:
    # Interface stubs and Minecraft API no-op overrides intentionally have empty
    # bodies; penalising them adds noise without improving the code.
    ignoreOverridden: true

exceptions:
  SwallowedException:
    # Underscore-prefixed names signal intentional suppression (e.g. catch (_e: Exception)
    # used when a fallback value is returned and the exception carries no actionable info).
    allowedExceptionNameRegex: '_.*|(ignore|expected).*'
  TooGenericExceptionCaught:
    # Catching Throwable is intentional in game-loop handlers (neighborChanged, tick, render)
    # to prevent Minecraft crashes when unexpected errors occur. Remove Throwable from the
    # default banned list. Underscore-prefixed names are used for intentional fallback catches.
    exceptionNames:
      - ArrayIndexOutOfBoundsException
      - Error
      - Exception
      - IllegalMonitorStateException
      - NullPointerException
      - IndexOutOfBoundsException
      - RuntimeException
    allowedExceptionNameRegex: '_.*|(ignore|expected).*'

style:
  LoopWithTooManyJumpStatements:
    # Loops with one break and one continue are idiomatic in Kotlin iteration;
    # the default threshold of 1 flags almost every non-trivial loop. Raise to 2
    # to allow the common continue-guard + break-early-exit pattern.
    maxJumpCount: 2
  # Early-return guard clauses are idiomatic Kotlin; the default of 2 flags
  # almost every non-trivial function. Raise to a level that catches genuine
  # spaghetti logic without penalising normal guard-clause style.
  ReturnCount:
    max: 4
  MagicNumber:
    # Test fixture and coordinate-heavy builder paths are excluded wholesale;
    # numbers there are structural, not domain magic numbers.
    excludes:
      - '**/gametestcommon/**'
      - '**/commands/DemoSections.kt'
    # Ignore universally accepted non-magic literals.
    ignoreNumbers:
      - '-1'
      - '0'
      - '1'
      - '2'
    # Numbers inside declarations that are already named constants need no
    # further extraction.
    ignoreConstantDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignorePropertyDeclaration: true
    ignoreEnums: true
    # Named arguments carry their own documentation at the call site.
    ignoreNamedArgument: true
    # Extension functions on numeric types (e.g. 16.toFloat()) are self-evident.
    ignoreExtensionFunctions: true
    # Functions/classes annotated with @GameTest are test fixtures; coordinate
    # literals there are structural, not domain magic numbers.
    ignoreAnnotated:
      - 'GameTest'
