# kt-analyzer configuration
# suppress: list of rule IDs to exclude from output
# severity-overrides: map of rule ID to severity (INFO, WARNING, ERROR)
#
# Rule IDs are Kotlin diagnostic factory names in UPPER_SNAKE_CASE, taken directly
# from the Analysis API.  Examples:
#   UNRESOLVED_REFERENCE                — unknown identifier
#   RETURN_TYPE_MISMATCH                — function return type does not match declared type
#   UNUSED_VARIABLE                     — local variable that is never read
#   REDUNDANT_CALL_OF_CONVERSION_METHOD — e.g. someInt.toInt() is a no-op
#   WRONG_TYPE_FOR_JAVA_OVERRIDE        — nullability mismatch when overriding a Java method
#   UNNECESSARY_NOT_NULL_ASSERTION      — !! on a value already known to be non-null
#
# Run without --config (or with --config /dev/null) to see all diagnostics and
# discover the IDs you want to suppress.
#
# NOTE: kt-analyzer is invoked with the full Minecraft compile classpath via
# 'make analyze-semantic'. Without --classpath the tool produces many cascade
# errors from unresolved platform types; do not run it classpath-free and then
# wonder why the suppress list is long.

suppress: []

severity-overrides: {}
